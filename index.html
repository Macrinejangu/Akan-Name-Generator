<!--Add basic HTML document structure and metadata-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--Link external CSS and HTML-->
  <title>Akan Name Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Add main container with heading and introductory paragraph-->
  <main class="container">
    <h1>Akan Name Generator</h1>
    <p>Enter your birth date and gender to discover your Ghanaian Akan name based on the day you were born.</p>

    <!--Add form with input fields for day, month, and year of birth-->
    <form id="akanForm">
      <div class="form-group">
        <label for="day">Day of Birth (1–31):</label>
        <input type="number" id="day" name="day" min="1" max="31" required>
      </div>

      <div class="form-group">
        <label for="month">Month of Birth (1–12):</label>
        <input type="number" id="month" name="month" min="1" max="12" required>
      </div>

      <div class="form-group">
        <label for="year">Year of Birth:</label>
        <input type="number" id="year" name="year" required>
      </div>

      <!--Add Gender selection radio buttons and submit button-->
      <div class="form-group">
        <p>Select Gender:</p>
        <label><input type="radio" name="gender" value="male" required> Male</label>
        <label><input type="radio" name="gender" value="female" required> Female</label>
      </div>

      <button type="submit">Get My Akan Name</button>
    </form>

    <section id="result" class="result">
      <!-- Akan name will be displayed here -->
    </section>
  </main>

  <!--Link external JS and HTML-->

  <script src="script.js"></script>
</body>
</html>
<!--Ensure proper semantic HTML and accessibility in form structure-->
